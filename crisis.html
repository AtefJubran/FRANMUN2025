<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRANMUN 2026 | Executive Control Console</title>
  <style>
    :root { --bg-dark: #04080f; --panel-bg: #09121d; --accent-gold: #dfb72c; --text-light: #ffffff; --text-muted: #8a99ad; --btn-accept: #2ecc71; --btn-reject: #e74c3c; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 320px; background: var(--panel-bg); border-right: 2px solid var(--accent-gold); padding: 25px; }
    .main-workspace { flex: 1; padding: 25px; overflow-y: auto; }
    .card { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .btn { padding: 10px; border: none; border-radius: 6px; cursor: pointer; color: #000; font-weight: bold; background: var(--accent-gold); width: 100%; }
    #statusAlertBanner { display: none; padding: 10px; background: #e74c3c; color: white; text-align: center; border-radius: 6px; margin-top: 10px; }
  </style>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
</head>
<body>
  <aside class="sidebar">
    <h1>FRANMUN Staff</h1>
    <div class="card">
      <label>Room Status</label>
      <select id="roomStatusSelect" onchange="updateRoomStatus()" style="width:100%; padding:8px; margin-top:5px;">
        <option value="Opened">Opened</option>
        <option value="Closed">Closed</option>
        <option value="Frozen">Frozen (Locked)</option>
      </select>
      <div id="statusAlertBanner">⚠️ ROOM FROZEN</div>
    </div>
  </aside>
  <main class="main-workspace">
    <div id="directivesPipeline"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = { /* أضف بيانات الـ Config الخاصة بك هنا */ };
    const db = getDatabase(initializeApp(firebaseConfig));

    window.updateRoomStatus = () => {
      const val = document.getElementById("roomStatusSelect").value;
      set(ref(db, 'room_status'), val);
    };

    onValue(ref(db, 'room_status'), (snap) => {
      const val = snap.val();
      document.getElementById("roomStatusSelect").value = val;
      document.getElementById("statusAlertBanner").style.display = (val === 'Frozen') ? 'block' : 'none';
    });
  </script>
</body>
</html>
