<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRANMUN 2026 | Admin Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-main: #060b13;
      --bg-card: rgba(15, 27, 47, 0.6);
      --accent-gold: #E4B343;
      --accent-gold-hover: #FFF1CD;
      --accent-red: #EF4444;
      --glass-border: rgba(255, 255, 255, 0.06);
      --text-light: #FFFFFF;
      --text-muted: #94A3B8;
      --text-body: #CBD5E1;
      --font-heading: 'Cinzel', Georgia, serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-light);
      padding: 40px 20px;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      font-family: var(--font-heading);
      color: var(--accent-gold);
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: white;
      font-family: var(--font-body);
      font-size: 14px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .checkbox-group input {
      width: auto;
    }

    .btn {
      background: var(--accent-gold);
      color: #060b13;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent-gold-hover);
    }

    .btn-danger {
      background: var(--accent-red);
      color: white;
    }

    .member-item, .drive-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--glass-border);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-img-preview {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent-gold);
    }

    .member-details h4 {
      font-size: 14px;
      color: white;
    }

    .member-details p {
      font-size: 12px;
      color: var(--accent-gold);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>FRANMUN Admin Dashboard</h1>

    <!-- 1. إعدادات عامة والعد التنازلي -->
    <div class="card">
      <h2>General Settings & Countdown</h2>
      
      <div class="grid-2">
        <div class="checkbox-group">
          <input type="checkbox" id="maintenanceMode">
          <label for="maintenanceMode" style="display:inline; margin:0; color:white;">Maintenance Mode</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="delegatesOpen">
          <label for="delegatesOpen" style="display:inline; margin:0; color:white;">Delegates Registration Open</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="chairsOpen">
          <label for="chairsOpen" style="display:inline; margin:0; color:white;">Chairs Registration Open</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="galleryLocked">
          <label for="galleryLocked" style="display:inline; margin:0; color:white;">Lock Conference Gallery</label>
        </div>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>Conference Target Date (Countdown)</label>
        <input type="text" id="targetDate" placeholder="e.g. 31 Oct 2026 at 8:00">
      </div>

      <button class="btn" onclick="saveGeneralSettings()">Save Settings</button>
    </div>

    <!-- 2. إدارة الأمانة العامة (Secretariat Team) مع فصل الاسم عن الوظيفة -->
    <div class="card">
      <h2>Secretariat General (SG) Team</h2>
      
      <div class="form-group">
        <label>Member Name (اسم العضو)</label>
        <input type="text" id="sgName" placeholder="e.g. Atef Jubran">
      </div>

      <div class="form-group">
        <label>Role / Title (الوظيفة أو المنصب)</label>
        <input type="text" id="sgRole" placeholder="e.g. Secretary-General">
      </div>
      
      <div class="form-group">
        <label>Image Filename / URL (اسم الصورة أو الرابط)</label>
        <input type="text" id="sgImg" placeholder="e.g. atef.jpg">
      </div>

      <div class="form-group">
        <label>Biography (النبذة التعريفية)</label>
        <textarea id="sgBio" rows="3" placeholder="Write SG bio here..."></textarea>
      </div>

      <button class="btn" id="saveMemberBtn" onclick="addOrUpdateSGMember()">+ Add SG Member</button>
      <button class="btn btn-danger" id="cancelEditBtn" style="display:none; margin-left: 10px;" onclick="clearSgForm()">Cancel</button>

      <div style="margin-top: 24px;">
        <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase;">Current SG Members</h3>
        <div id="adminSgList">
          <p style="color: var(--text-muted); font-size: 13px;">Loading SG members...</p>
        </div>
      </div>
    </div>

    <!-- 3. ملفات الجاليري (Drive Files) -->
    <div class="card">
      <h2>Conference Gallery Drive Files</h2>
      
      <div class="form-group">
        <label>File Title</label>
        <input type="text" id="driveTitle" placeholder="e.g. Day 1 Photos">
      </div>
      
      <div class="form-group">
        <label>Drive Link</label>
        <input type="text" id="driveLink" placeholder="https://drive.google.com/...">
      </div>

      <button class="btn" onclick="addDriveFile()">+ Add Drive Link</button>

      <div style="margin-top: 24px;" id="adminDriveList">
        <p style="color: var(--text-muted); font-size: 13px;">No drive files added yet.</p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTMBi7k8XzwrNk5MERo7LXtApvhAid08E",
      authDomain: "franmun-f5498.firebaseapp.com",
      databaseURL: "https://franmun-f5498-default-rtdb.firebaseio.com",
      projectId: "franmun-f5498",
      storageBucket: "franmun-f5498.firebasestorage.app",
      messagingSenderId: "574017816071",
      appId: "1:574017816071:web:1968d9a793dec6a6cacca2",
      measurementId: "G-WRXCD54P71"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let appData = {};
    let editingIndex = -1;

    // جلب البيانات بالكامل من فايربيس
    database.ref("homepage_data").on("value", (snapshot) => {
      if (snapshot.exists()) {
        appData = snapshot.val() || {};
        populateGeneralSettings();
        renderAdminSgList();
        renderAdminDriveList();
      }
    });

    function populateGeneralSettings() {
      document.getElementById("maintenanceMode").checked = !!appData.maintenanceMode;
      document.getElementById("delegatesOpen").checked = !!appData.delegatesOpen;
      document.getElementById("chairsOpen").checked = !!appData.chairsOpen;
      document.getElementById("galleryLocked").checked = !!appData.galleryLocked;
      document.getElementById("targetDate").value = appData.targetDate || "";
    }

    function saveGeneralSettings() {
      const settings = {
        maintenanceMode: document.getElementById("maintenanceMode").checked,
        delegatesOpen: document.getElementById("delegatesOpen").checked,
        chairsOpen: document.getElementById("chairsOpen").checked,
        galleryLocked: document.getElementById("galleryLocked").checked,
        targetDate: document.getElementById("targetDate").value.trim()
      };

      database.ref("homepage_data").update(settings)
        .then(() => alert("Settings saved successfully!"))
        .catch(err => alert("Error: " + err.message));
    }

    // إدارة الأمانة العامة
    function renderAdminSgList() {
      const container = document.getElementById("adminSgList");
      const team = appData.sgTeam || [];

      if (team.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">No SG members added yet.</p>`;
        return;
      }

      let html = "";
      team.forEach((member, index) => {
        html += `
          <div class="member-item">
            <div class="member-info">
              <img src="${member.img || 'logo.jpeg.JPG'}" class="member-img-preview" onerror="this.src='logo.jpeg.JPG'">
              <div class="member-details">
                <h4>${member.name || 'No Name'}</h4>
                <p>${member.role || 'No Role'}</p>
              </div>
            </div>
            <div>
              <button class="btn" style="padding: 6px 12px; font-size: 12px; margin-right: 6px;" onclick="editSgMember(${index})">Edit</button>
              <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteSgMember(${index})">Remove</button>
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    function addOrUpdateSGMember() {
      const name = document.getElementById("sgName").value.trim();
      const role = document.getElementById("sgRole").value.trim();
      const img = document.getElementById("sgImg").value.trim();
      const bio = document.getElementById("sgBio").value.trim();

      if (!name || !role) {
        alert("Please enter both the Member Name and the Role/Title.");
        return;
      }

      let team = appData.sgTeam ? [...appData.sgTeam] : [];
      const memberData = {
        name: name,
        role: role,
        img: img || "logo.jpeg.JPG",
        bio: bio || "No biography provided."
      };

      if (editingIndex >= 0) {
        team[editingIndex] = memberData;
      } else {
        team.push(memberData);
      }

      database.ref("homepage_data/sgTeam").set(team)
        .then(() => {
          alert("Member saved successfully!");
          clearSgForm();
        })
        .catch(err => alert("Error: " + err.message));
    }

    function editSgMember(index) {
      const member = appData.sgTeam[index];
      document.getElementById("sgName").value = member.name || "";
      document.getElementById("sgRole").value = member.role || "";
      document.getElementById("sgImg").value = member.img || "";
      document.getElementById("sgBio").value = member.bio || "";
      
      editingIndex = index;
      document.getElementById("saveMemberBtn").innerText = "Update Member";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSgMember(index) {
      if (confirm("Are you sure you want to remove this member?")) {
        let team = appData.sgTeam ? [...appData.sgTeam] : [];
        team.splice(index, 1);
        database.ref("homepage_data/sgTeam").set(team)
          .then(() => alert("Member removed successfully!"))
          .catch(err => alert("Error: " + err.message));
      }
    }

    function clearSgForm() {
      document.getElementById("sgName").value = "";
      document.getElementById("sgRole").value = "";
      document.getElementById("sgImg").value = "";
      document.getElementById("sgBio").value = "";
      editingIndex = -1;
      document.getElementById("saveMemberBtn").innerText = "+ Add SG Member";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    // إدارة ملفات الدريف
    function addDriveFile() {
      const title = document.getElementById("driveTitle").value.trim();
      const link = document.getElementById("driveLink").value.trim();

      if (!title || !link) {
        alert("Please fill in both title and link.");
        return;
      }

      let files = appData.driveFiles ? [...appData.driveFiles] : [];
      files.push({ title, link });

      database.ref("homepage_data/driveFiles").set(files)
        .then(() => {
          alert("Drive file added successfully!");
          document.getElementById("driveTitle").value = "";
          document.getElementById("driveLink").value = "";
        })
        .catch(err => alert("Error: " + err.message));
    }

    function renderAdminDriveList() {
      const container = document.getElementById("adminDriveList");
      const files = appData.driveFiles || [];

      if (files.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">No drive files added yet.</p>`;
        return;
      }

      let html = "";
      files.forEach((file, index) => {
        html += `
          <div class="drive-item">
            <div>
              <h4 style="font-size: 14px; color: white;">${file.title}</h4>
              <a href="${file.link}" target="_blank" style="font-size: 12px; color: var(--accent-gold);">${file.link}</a>
            </div>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteDriveFile(${index})">Remove</button>
          </div>`;
      });
      container.innerHTML = html;
    }

    function deleteDriveFile(index) {
      if (confirm("Are you sure you want to remove this link?")) {
        let files = appData.driveFiles ? [...appData.driveFiles] : [];
        files.splice(index, 1);
        database.ref("homepage_data/driveFiles").set(files)
          .then(() => alert("File removed successfully!"))
          .catch(err => alert("Error: " + err.message));
      }
    }
  </script>
</body>
</html>
