<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRANMUN 2026 | Admin Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-main: #060b13;
      --bg-card: rgba(15, 27, 47, 0.6);
      --accent-gold: #E4B343;
      --accent-gold-hover: #FFF1CD;
      --accent-red: #EF4444;
      --glass-border: rgba(255, 255, 255, 0.06);
      --text-light: #FFFFFF;
      --text-muted: #94A3B8;
      --text-body: #CBD5E1;
      --font-heading: 'Cinzel', Georgia, serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-light);
      padding: 40px 20px;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      font-family: var(--font-heading);
      color: var(--accent-gold);
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: white;
      font-family: var(--font-body);
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .btn {
      background: var(--accent-gold);
      color: #060b13;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent-gold-hover);
    }

    .btn-danger {
      background: var(--accent-red);
      color: white;
    }

    .member-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--glass-border);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-img-preview {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent-gold);
    }

    .member-details h4 {
      font-size: 14px;
      color: white;
    }

    .member-details p {
      font-size: 12px;
      color: var(--accent-gold);
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>FRANMUN Admin Dashboard</h1>
    
    <!-- قسم إدارة الأمانة العامة (Secretariat General Team) -->
    <div class="card">
      <div class="section-header-row">
        <h2>Secretariat General (SG) Team</h2>
      </div>
      
      <div class="form-group">
        <label>Member Name (اسم العضو)</label>
        <input type="text" id="sgName" placeholder="e.g. Atef Jubran">
      </div>

      <div class="form-group">
        <label>Role / Position (الوظيفة أو المنصب)</label>
        <input type="text" id="sgRole" placeholder="e.g. Secretary-General">
      </div>
      
      <div class="form-group">
        <label>Image Filename / URL (اسم الصورة أو الرابط)</label>
        <input type="text" id="sgImg" placeholder="e.g. atef.jpg">
      </div>

      <div class="form-group">
        <label>Biography (النبذة التعريفية)</label>
        <textarea id="sgBio" rows="3" placeholder="Write SG bio here..."></textarea>
      </div>

      <button class="btn" id="saveMemberBtn" onclick="addOrUpdateSGMember()">+ Add SG Member</button>
      <button class="btn btn-danger" id="cancelEditBtn" style="display:none; margin-left: 10px;" onclick="clearForm()">Cancel</button>
    </div>

    <!-- قائمة الأعضاء الحاليين -->
    <div class="card">
      <h2>SG Members List</h2>
      <div id="adminSgList">
        <p style="color: var(--text-muted); font-size: 13px;">Loading SG members...</p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTMBi7k8XzwrNk5MERo7LXtApvhAid08E",
      authDomain: "franmun-f5498.firebaseapp.com",
      databaseURL: "https://franmun-f5498-default-rtdb.firebaseio.com",
      projectId: "franmun-f5498",
      storageBucket: "franmun-f5498.firebasestorage.app",
      messagingSenderId: "574017816071",
      appId: "1:574017816071:web:1968d9a793dec6a6cacca2",
      measurementId: "G-WRXCD54P71"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentSgTeam = [];
    let editingIndex = -1;

    // جلب البيانات وعرضها مباشرة من فايربيس
    database.ref("homepage_data/sgTeam").on("value", (snapshot) => {
      if (snapshot.exists()) {
        currentSgTeam = snapshot.val() || [];
      } else {
        currentSgTeam = [];
      }
      renderAdminSgList();
    });

    function renderAdminSgList() {
      const container = document.getElementById("adminSgList");
      if (currentSgTeam.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">No SG members added yet.</p>`;
        return;
      }

      let html = "";
      currentSgTeam.forEach((member, index) => {
        html += `
          <div class="member-item">
            <div class="member-info">
              <img src="${member.img || 'logo.jpeg.JPG'}" class="member-img-preview" onerror="this.src='logo.jpeg.JPG'">
              <div class="member-details">
                <h4>${member.name || 'No Name'}</h4>
                <p>${member.role || 'No Role'}</p>
              </div>
            </div>
            <div>
              <button class="btn" style="padding: 6px 12px; font-size: 12px; margin-right: 6px;" onclick="editMember(${index})">Edit</button>
              <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteMember(${index})">Remove</button>
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    function addOrUpdateSGMember() {
      const name = document.getElementById("sgName").value.trim();
      const role = document.getElementById("sgRole").value.trim();
      const img = document.getElementById("sgImg").value.trim();
      const bio = document.getElementById("sgBio").value.trim();

      if (!name || !role) {
        alert("Please enter both the Member Name and the Role/Title.");
        return;
      }

      const memberData = {
        name: name,
        role: role,
        img: img || "logo.jpeg.JPG",
        bio: bio || "No biography provided."
      };

      if (editingIndex >= 0) {
        currentSgTeam[editingIndex] = memberData;
      } else {
        currentSgTeam.push(memberData);
      }

      database.ref("homepage_data/sgTeam").set(currentSgTeam)
        .then(() => {
          alert("Member saved successfully!");
          clearForm();
        })
        .catch((error) => {
          alert("Error saving data: " + error.message);
        });
    }

    function editMember(index) {
      const member = currentSgTeam[index];
      document.getElementById("sgName").value = member.name || "";
      document.getElementById("sgRole").value = member.role || "";
      document.getElementById("sgImg").value = member.img || "";
      document.getElementById("sgBio").value = member.bio || "";
      
      editingIndex = index;
      document.getElementById("saveMemberBtn").innerText = "Update Member";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteMember(index) {
      if (confirm("Are you sure you want to remove this member?")) {
        currentSgTeam.splice(index, 1);
        database.ref("homepage_data/sgTeam").set(currentSgTeam)
          .then(() => {
            alert("Member removed successfully!");
          })
          .catch((error) => {
            alert("Error removing data: " + error.message);
          });
      }
    }

    function clearForm() {
      document.getElementById("sgName").value = "";
      document.getElementById("sgRole").value = "";
      document.getElementById("sgImg").value = "";
      document.getElementById("sgBio").value = "";
      editingIndex = -1;
      document.getElementById("saveMemberBtn").innerText = "+ Add SG Member";
      document.getElementById("cancelEditBtn").style.display = "none";
    }
  </script>
</body>
</html>
