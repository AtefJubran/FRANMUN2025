<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRANMUN 2026 | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-main: #060b13;
      --bg-card: rgba(15, 27, 47, 0.7);
      --accent-gold: #E4B343;
      --accent-gold-hover: #FFF1CD;
      --accent-red: #EF4444;
      --accent-green: #10B981;
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-light: #FFFFFF;
      --text-muted: #94A3B8;
      --text-body: #CBD5E1;
      --font-body: 'Inter', sans-serif;
      --radius-card: 16px;
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-light);
      padding: 30px 20px;
      line-height: 1.5;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-box {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 24px;
      border-radius: var(--radius-card);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    h1 { font-size: 22px; color: #FFF; font-weight: 700; }
    h2 { font-size: 16px; color: var(--accent-gold); margin-bottom: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 24px;
      border-radius: var(--radius-card);
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-body);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"], input[type="datetime-local"], textarea, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      padding: 10px 14px;
      border-radius: 8px;
      color: #FFF;
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-gold);
    }

    textarea { resize: vertical; height: 90px; }

    .toggle-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #FFF;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn {
      background: var(--accent-gold);
      color: #060b13;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: var(--transition-smooth);
    }

    .btn:hover { background: var(--accent-gold-hover); }

    .btn-danger {
      background: var(--accent-red);
      color: #FFF;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
    }
    
    .btn-danger:hover { opacity: 0.85; }

    .committee-admin-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .chair-item-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--glass-border);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status-msg {
      font-size: 13px;
      color: var(--accent-green);
      margin-left: 12px;
      display: inline-block;
    }

    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
      .toggle-row { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-box">
      <h1>FRANMUN Control Panel</h1>
      <button class="btn" onclick="saveAllData()">Save Changes</button>
      <span id="saveStatus" class="status-msg"></span>
    </div>

    <!-- إعدادات عامة وحالة الموقع -->
    <div class="card">
      <h2>General Settings</h2>
      <div class="toggle-row">
        <label class="checkbox-label">
          <input type="checkbox" id="maintenanceMode"> Maintenance Mode (وضع الصيانة)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="delegatesOpen"> Delegates Registration Open
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chairsOpen"> Chairs Registration Open
        </label>
      </div>
      <div class="form-group">
        <label>Conference Target Date (تاريخ المؤتمر للعد التنازلي)</label>
        <input type="datetime-local" id="targetDate">
      </div>
    </div>

    <!-- إدارة لجان المؤتمر (Topics, Links, Chairs & Bios) -->
    <div class="card">
      <h2>Committees Management (أجندة ورؤساء اللجان)</h2>
      <div class="form-group">
        <label>Select Committee to Edit:</label>
        <select id="committeeSelector" onchange="loadSelectedCommitteeData()">
          <option value="UNWOMEN">UN Women</option>
          <option value="UNHRC">UNHRC</option>
          <option value="DISEC">DISEC</option>
          <option value="WHO">WHO</option>
          <option value="UNHSC">UNHSC</option>
          <option value="CRISIS">CRISIS</option>
          <option value="UNICEF">UNICEF</option>
        </select>
      </div>

      <div class="committee-admin-box">
        <div class="form-group">
          <label>Topics & Agenda (مواضيع اللجنة)</label>
          <textarea id="commTopics"></textarea>
        </div>
        <div class="form-group">
          <label>Research Report Link (رابط ملف البحث)</label>
          <input type="text" id="commReport">
        </div>
        <div class="toggle-row">
          <label class="checkbox-label">
            <input type="checkbox" id="chairsComingSoon"> Chairs Coming Soon (إخفاء التشيرز بختم سري)
          </label>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 16px 0;">

        <h3>Chairs (أعضاء الرئاسة)</h3>
        <div id="chairsListContainer"></div>
        <button class="btn" style="margin-top: 10px; font-size: 12px; padding: 6px 14px;" onclick="addChairField()">+ Add Chair</button>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 40px;">
      <button class="btn" style="padding: 14px 40px; font-size: 16px;" onclick="saveAllData()">Save All Changes</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTMBi7k8XzwrNk5MERo7LXtApvhAid08E",
      authDomain: "franmun-f5498.firebaseapp.com",
      databaseURL: "https://franmun-f5498-default-rtdb.firebaseio.com",
      projectId: "franmun-f5498",
      storageBucket: "franmun-f5498.firebasestorage.app",
      messagingSenderId: "574017816071",
      appId: "1:574017816071:web:1968d9a793dec6a6cacca2",
      measurementId: "G-WRXCD54P71"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let siteData = {};
    let activeCommitteeChairs = [];

    database.ref("homepage_data").on("value", (snapshot) => {
      if (snapshot.exists()) {
        siteData = snapshot.val() || {};
        populateGeneralSettings();
        loadSelectedCommitteeData();
      }
    });

    function populateGeneralSettings() {
      document.getElementById("maintenanceMode").checked = !!siteData.maintenanceMode;
      document.getElementById("delegatesOpen").checked = !!siteData.delegatesOpen;
      document.getElementById("chairsOpen").checked = !!siteData.chairsOpen;
      if (siteData.targetDate) {
        document.getElementById("targetDate").value = siteData.targetDate;
      }
    }

    function loadSelectedCommitteeData() {
      const commKey = document.getElementById("committeeSelector").value;
      if (!siteData.committees) siteData.committees = {};
      if (!siteData.committees[commKey]) {
        siteData.committees[commKey] = { topics: "", report: "", chairsComingSoon: false, chairs: [] };
      }

      const comm = siteData.committees[commKey];
      document.getElementById("commTopics").value = comm.topics || "";
      document.getElementById("commReport").value = comm.report || "";
      document.getElementById("chairsComingSoon").checked = !!comm.chairsComingSoon;

      activeCommitteeChairs = comm.chairs ? JSON.parse(JSON.stringify(comm.chairs)) : [];
      renderChairsInputs();
    }

    function renderChairsInputs() {
      const container = document.getElementById("chairsListContainer");
      let html = "";
      
      activeCommitteeChairs.forEach((chair, index) => {
        html += `
          <div class="chair-item-box">
            <div class="grid-2" style="margin-bottom: 8px;">
              <div>
                <label>Chair Name</label>
                <input type="text" value="${chair.name || ''}" onchange="updateChairProp(${index}, 'name', this.value)">
              </div>
              <div>
                <label>Image Filename (e.g. name.jpg)</label>
                <input type="text" value="${chair.img || ''}" onchange="updateChairProp(${index}, 'img', this.value)">
              </div>
            </div>
            <div class="form-group" style="margin-bottom: 8px;">
              <label>Biography (البايو)</label>
              <textarea style="height: 60px;" onchange="updateChairProp(${index}, 'bio', this.value)">${chair.bio || ''}</textarea>
            </div>
            <button class="btn-danger" onclick="removeChair(${index})">Delete Chair</button>
          </div>`;
      });

      container.innerHTML = html || "<p style='font-size:12px; color:var(--text-muted);'>No chairs added yet for this committee.</p>";
    }

    function updateChairProp(index, prop, val) {
      if (activeCommitteeChairs[index]) {
        activeCommitteeChairs[index][prop] = val;
      }
    }

    function addChairField() {
      activeCommitteeChairs.push({ name: "", img: "", bio: "" });
      renderChairsInputs();
    }

    function removeChair(index) {
      activeCommitteeChairs.splice(index, 1);
      renderChairsInputs();
    }

    function saveAllData() {
      const commKey = document.getElementById("committeeSelector").value;

      // جمع البيانات الحالية من واجهة التحكم
      siteData.maintenanceMode = document.getElementById("maintenanceMode").checked;
      siteData.delegatesOpen = document.getElementById("delegatesOpen").checked;
      siteData.chairsOpen = document.getElementById("chairsOpen").checked;
      siteData.targetDate = document.getElementById("targetDate").value;

      if (!siteData.committees) siteData.committees = {};
      if (!siteData.committees[commKey]) siteData.committees[commKey] = {};

      siteData.committees[commKey].topics = document.getElementById("commTopics").value;
      siteData.committees[commKey].report = document.getElementById("commReport").value;
      siteData.committees[commKey].chairsComingSoon = document.getElementById("chairsComingSoon").checked;
      siteData.committees[commKey].chairs = activeCommitteeChairs;

      database.ref("homepage_data").set(siteData, (error) => {
        const statusEl = document.getElementById("saveStatus");
        if (error) {
          statusEl.style.color = "var(--accent-red)";
          statusEl.innerText = "Failed to save!";
        } else {
          statusEl.style.color = "var(--accent-green)";
          statusEl.innerText = "Saved successfully! ✓";
          setTimeout(() => { statusEl.innerText = ""; }, 3000);
        }
      });
    }
  </script>
</body>
</html>
